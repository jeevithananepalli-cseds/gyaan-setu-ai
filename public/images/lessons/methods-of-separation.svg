<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Methods of Separation</title>
  <desc id="desc">A school science illustration showing filtration, decantation, evaporation, and handpicking.</desc>
  <rect width="800" height="520" fill="#f4f8fb"/>
  <rect x="20" y="20" width="760" height="480" rx="18" fill="#ffffff" stroke="#b8cad6" stroke-width="3"/>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#17324d">Methods of Separation</text>

  <g transform="translate(45 90)">
    <rect width="330" height="175" rx="12" fill="#e8f5f2" stroke="#79b8ae" stroke-width="2"/>
    <text x="165" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#174d49">Filtration</text>
    <path d="M105 55 L225 55 L178 116 L152 116 Z" fill="#fff8e7" stroke="#9c7b39" stroke-width="3"/>
    <path d="M152 116 L178 116 L178 148 L152 148 Z" fill="#c9e6ef" stroke="#4e8295" stroke-width="3"/>
    <path d="M120 55 Q165 75 210 55" fill="none" stroke="#b58a44" stroke-width="3"/>
    <circle cx="145" cy="68" r="5" fill="#8b5e3c"/><circle cx="166" cy="75" r="5" fill="#8b5e3c"/><circle cx="187" cy="66" r="5" fill="#8b5e3c"/>
    <path d="M165 119 V140" stroke="#3185a0" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#315363">solid particles stay in the filter</text>
  </g>

  <g transform="translate(425 90)">
    <rect width="330" height="175" rx="12" fill="#fff4e7" stroke="#d6a56c" stroke-width="2"/>
    <text x="165" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#70421e">Decantation</text>
    <path d="M85 62 L220 62 L207 137 Q202 150 188 150 L117 150 Q103 150 98 137 Z" fill="#d8f0f8" stroke="#4e8295" stroke-width="3"/>
    <path d="M85 112 Q150 102 215 112 L210 137 Q205 150 188 150 L117 150 Q103 150 98 137 Z" fill="#c8a36a"/>
    <path d="M177 62 L252 62 L291 105" fill="none" stroke="#4e8295" stroke-width="12" stroke-linecap="round"/>
    <path d="M258 111 Q278 120 291 105" fill="none" stroke="#4e8295" stroke-width="8"/>
    <path d="M274 114 V143" stroke="#3185a0" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#634a32">pour the clear liquid away</text>
  </g>

  <g transform="translate(45 295)">
    <rect width="330" height="175" rx="12" fill="#fff8df" stroke="#d8bd62" stroke-width="2"/>
    <text x="165" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#725a16">Evaporation</text>
    <path d="M83 118 Q165 143 247 118 L230 143 Q165 165 100 143 Z" fill="#b9dfea" stroke="#4e8295" stroke-width="3"/>
    <path d="M113 117 Q165 130 217 117" fill="none" stroke="#dfb341" stroke-width="5"/>
    <path d="M120 98 Q108 76 123 57 M165 98 Q153 72 168 50 M210 98 Q198 76 213 57" fill="none" stroke="#8bb7c4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="95" cy="62" r="20" fill="#ffd75b" stroke="#d99e25" stroke-width="3"/>
    <path d="M95 32 V20 M65 62 H53 M117 40 L126 31" stroke="#d99e25" stroke-width="3"/>
    <text x="165" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#635327">water leaves as vapour</text>
  </g>

  <g transform="translate(425 295)">
    <rect width="330" height="175" rx="12" fill="#f4edff" stroke="#a995d0" stroke-width="2"/>
    <text x="165" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#503b78">Handpicking</text>
    <path d="M82 108 Q105 77 140 88 Q158 96 151 115 Q141 139 112 143 Q91 143 82 128 Z" fill="#f0b7a7" stroke="#a86658" stroke-width="3"/>
    <path d="M130 99 Q164 76 193 90 Q224 105 239 132" fill="none" stroke="#f0b7a7" stroke-width="18" stroke-linecap="round"/>
    <circle cx="88" cy="67" r="11" fill="#8a5a3b"/><circle cx="122" cy="70" r="11" fill="#d7a33f"/><circle cx="158" cy="65" r="11" fill="#6b8794"/><circle cx="198" cy="73" r="11" fill="#8a5a3b"/><circle cx="233" cy="65" r="11" fill="#d7a33f"/>
    <path d="M165 87 L159 68" stroke="#f0b7a7" stroke-width="9" stroke-linecap="round"/>
    <text x="165" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#584b6b">remove unwanted pieces by hand</text>
  </g>
</svg>
