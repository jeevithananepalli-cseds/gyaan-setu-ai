<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><title>Temperature and Heat</title><rect width="640" height="360" fill="#fff1e6"/><text x="320" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#803d2a">Temperature and Heat</text><circle cx="180" cy="170" r="70" fill="#ef7654" stroke="#a94632" stroke-width="5"/><circle cx="460" cy="170" r="70" fill="#8ac8dd" stroke="#4f8da1" stroke-width="5"/><path d="M270 170 H370" stroke="#e1a33c" stroke-width="10"/><path d="M350 150 L375 170 L350 190" fill="none" stroke="#e1a33c" stroke-width="8"/><text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">hot</text><text x="460" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">cool</text><text x="320" y="295" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#803d2a">heat flows from hotter to cooler</text></svg>